name: Website build & deploy

on:
  # The firmware workflow already deploys both the site and firmware. Run this
  # follow-up build only after that deployment completes, so gh-pages updates
  # stay serialized and the firmware directory is preserved.
  workflow_run:
    workflows: ["Firmware Build & Deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies & build website
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Check if gh-pages branch exists
        id: branch_check
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout gh-pages branch
        if: steps.branch_check.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _site
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialise empty _site on first deploy
        if: steps.branch_check.outputs.exists == 'false'
        run: mkdir -p _site

      - name: Replace website output and preserve firmware
        run: |
          find _site -mindepth 1 -maxdepth 1 \
            ! -name firmware ! -name .git \
            -exec rm -rf {} +
          cp -r website/.vitepress/dist/. _site/

      - name: Commit & push to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd _site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -d .git ]; then
            git init -b gh-pages
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed — skipping push"
          else
            git commit -m "deploy: website ${GITHUB_SHA}"
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
              push origin HEAD:gh-pages
          fi
